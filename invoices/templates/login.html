{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - JobPortal</title>

   <script>
    const savedTheme = localStorage.getItem("jobportal-theme");

    if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
    }
</script>

<link rel="stylesheet" href="{% static 'job_style.css' %}" />
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">JobPortal</div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">Login to continue to your account</p>

     {% if error %}
    <div class="login-error">
        <span class="error-icon">!</span>
        <span>{{ error }}</span>
    </div>
{% endif %}

        <form method="POST">
          {% csrf_token %}

          <div class="form-group">
            <label>Username</label>
<input
    type="text"
    name="username"
    class="auth-input"
    placeholder="Enter your username"
    required
/>
          </div>

          <div class="form-group">
            <label>Password</label>
<input
    type="password"
    name="password"
    class="auth-input"
    placeholder="Enter your password"
    required
/>
          </div>

          <button type="submit" class="auth-btn">Login</button>
        </form>

        <p class="auth-footer">
          Don't have an account?

          <a href="{% url 'register' %}"> Register </a>
        </p>
      </div>
    </div>
  </body>
</html>
